<!DOCTYPE html>
<html>

<head>
    <title>Biodata Mahasiswa</title>
</head>

<body>

    <header>
        <h1>Biodata Mahasiswa</h1>
    </header>

    <nav>
        <a href="index.html">Beranda</a> |
        <a href="#biodata">Biodata</a> |
        <a href="#form">Form</a> |
        <a href="#media">Multimedia</a>
    </nav>

    <main>

        <!-- DATA BIODATA -->
        <section id="biodata">

            <h2>Data Mahasiswa</h2>

            <table border="1">

                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Keterangan</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>NIM</td>
                        <td>312410001</td>
                    </tr>

                    <tr>
                        <td>Nama</td>
                        <td>Marisa Puspita Sari</td>
                    </tr>

                    <tr>
                        <td>Program Studi</td>
                        <td>Teknik Informatika</td>
                    </tr>

                    <tr>
                        <td>Universitas</td>
                        <td>Universitas Pelita Bangsa</td>
                    </tr>
                </tbody>

            </table>

        </section>


        <!-- FORM -->
        <section id="form">

            <h2>Form Biodata</h2>

            <form>

                <label for="nama">Nama:</label><br>
                <input type="text"
                       id="nama"
                       name="nama"
                       required
                       minlength="3">

                <br><br>


                <label for="email">Email:</label><br>
                <input type="email"
                       id="email"
                       name="email"
                       required>

                <br><br>


                <label for="umur">Umur:</label><br>
                <input type="number"
                       id="umur"
                       name="umur"
                       min="17"
                       max="60"
                       required>

                <br><br>


                <label for="prodi">Program Studi:</label><br>

                <select id="prodi" name="prodi" required>

                    <option value="">-- Pilih Program Studi --</option>
                    <option value="ti">Teknik Informatika</option>
                    <option value="si">Sistem Informasi</option>

                </select>

                <br><br>


                <label for="alamat">Alamat:</label><br>

                <textarea
                    id="alamat"
                    name="alamat"
                    rows="5"
                    cols="40"
                    required></textarea>

                <br><br>


                <button type="submit">Simpan</button>
                <button type="reset">Reset</button>

            </form>

        </section>


        <!-- MULTIMEDIA -->
        <section id="media">

            <h2>Multimedia</h2>

            <h3>Audio</h3>

            <audio controls>
                <source src="media/audio.mp3" type="audio/mpeg">
                Browser tidak mendukung audio.
            </audio>

            <h3>Video</h3>

            <video controls width="480">
                <source src="media/video.mp4" type="video/mp4">
                Browser tidak mendukung video.
            </video>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 Teknik Informatika</p>

    </footer>

</body>

</html>
